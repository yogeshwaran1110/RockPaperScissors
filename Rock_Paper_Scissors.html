<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissorie</title>
    <link rel="stylesheet" href="./styles/12-r-excercises.css">
</head>
<body>
  <center>
    <p class="title">Rock Paper Scissors</p>
        
        <button class="move-button js-rock-button">
        <img src="./media/rock.png" class="move-icon">
        </button>
        
        <button class="move-button js-paper-button" >
        <img src="./media/paper.png" class="move-icon" >
        </button>
        
        <button class="move-button js-scissors-button">
        <img src="./media/scissors.png" class="move-icon" >
        </button>
        
        <p class="js-result result"></p>

        <p class="js-moves"></p>

        <p class="js-score score"></p>

        <button class="reset js-reset-button">Rest Score</button>

        <button class="auto-play-button js-auto-play-button"
        ">Auto Play</button>

        <p class="js-reset-confirmation"></p>
  </center>

        <script src="./scripts/12-r-excercises.js"></script>
</body>
</html>
